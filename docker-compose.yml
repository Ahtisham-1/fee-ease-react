version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: feeease_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: feeease_db
    ports:
      - "5432:5432"
    volumes:
      - feeease_pgdata:/var/lib/postgresql/data

volumes:
  feeease_pgdata:
